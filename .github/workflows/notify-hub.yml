# 앱 저장소의 .github/workflows/notify-hub.yml 로 복사해서 사용
# 필요: 앱 저장소 Settings > Secrets and variables > Actions 에 HUB_DEPLOY_HOOK 등록
# main 에 push 되면 AIEDU 허브(Vercel)를 즉시 다시 배포한다.
# 보안: 토큰 권한 없음(permissions: {}), 외부 액션 사용 안 함, 시간 제한. 시크릿이 없으면 조용히 건너뛴다.
name: Notify AIEDU hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger hub deploy
        env:
          HOOK: ${{ secrets.HUB_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::HUB_DEPLOY_HOOK secret 이 없어 허브 재배포를 건너뜁니다."
            exit 0
          fi
          curl -fsS --max-time 30 --retry 2 -X POST "$HOOK"
