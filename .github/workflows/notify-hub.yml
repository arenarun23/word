# main 에 푸시되면 허브(aiedu)를 다시 배포하도록 알린다.
# 필요: 이 저장소 Settings > Secrets and variables > Actions 에 HUB_DEPLOY_HOOK (Vercel 허브 프로젝트의 Deploy Hook 주소)
# 시크릿이 없으면 아무것도 하지 않고 건너뛴다.
name: Notify hub
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger hub deploy
        env:
          HOOK: ${{ secrets.HUB_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "HUB_DEPLOY_HOOK 시크릿이 없어 허브 재배포를 건너뜁니다."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
