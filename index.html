<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC83D">
<title>끝말잇기 놀이터</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23FFC83D'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' font-family='sans-serif' font-weight='700' fill='%233F2C00'%3E끝%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --font-display:'Jua','Gowun Dodum',system-ui,sans-serif;
  --font-body:'Gowun Dodum','Jua',system-ui,sans-serif;
  --bg:#FFF4D6; --surface:#FFFFFF; --ink:#33260A; --ink-soft:#7A6535; --line:#F0DCA6;
  --primary:#F08A00; --primary-soft:#FFE7B8; --primary-ink:#FFFFFF;
  --kid:#3B74F5; --kid-soft:#DCE8FF;
  --sun:#FFC83D; --sun-edge:#D99A00; --sun-ink:#3F2C00;
  --ok:#178F5E; --ok-bg:#D9F4E7; --oops:#C8610C; --oops-bg:#FFE9D2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1708; --surface:#2C2310; --ink:#FFF1CC; --ink-soft:#CDB67A; --line:#4D3E1B;
    --primary:#FFB547; --primary-soft:#4A3711; --primary-ink:#2A1D00;
    --kid:#7BA3FF; --kid-soft:#243268;
    --sun:#FFD04F; --sun-edge:#B8860B; --sun-ink:#2E2000;
    --ok:#52D9A0; --ok-bg:#123A2D; --oops:#FFA552; --oops-bg:#432E19; color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:22px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1.05rem;font-weight:700;line-height:1.45;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.app{max-width:720px;margin:0 auto;min-height:100dvh;padding:12px max(14px,env(safe-area-inset-right)) 28px max(14px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-family:var(--font-display);font-weight:400;font-size:1.45rem;margin:0}
.iconbtn{white-space:nowrap;border:2px solid var(--line);background:var(--surface);border-radius:999px;min-width:48px;height:48px;padding:0 12px;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:4px}
h2{font-family:var(--font-display);font-weight:400;font-size:1.2rem;margin:0 0 8px}

/* 마스코트 */
.mascot{width:110px;height:110px;flex:none;overflow:visible}
.mascot .m-happy,.mascot .m-oops,.mascot .m-talk,.mascot .e-happy{display:none}
.mascot[data-mood="cheer"] .e-open{display:none}
.mascot[data-mood="cheer"] .e-happy{display:inline}
.mascot[data-mood="oops"] .m-smile{display:none}
.mascot[data-mood="oops"] .m-oops{display:inline}
.speaking .m-smile,.speaking .m-oops{display:none}
.speaking .m-talk{display:inline;transform-box:fill-box;transform-origin:center;animation:talk .26s infinite alternate}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.1)}}
.mascot[data-mood="cheer"]{animation:hop .6s ease 2}
.mascot[data-mood="oops"]{animation:wob .5s ease 1}
@keyframes hop{50%{transform:translateY(-12px)}}
@keyframes wob{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.hero{display:flex;align-items:center;gap:12px}
.bubble{position:relative;background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:10px 16px;min-width:0;flex:1;font-size:1rem}
.bubble::before{content:"";position:absolute;left:-12px;top:30px;width:20px;height:20px;background:var(--surface);border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg)}

/* 홈 */
.group{margin-bottom:6px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:10px 14px;min-width:0}
.choice .g{font-size:1.8rem;line-height:1.15}
.choice .t{font-family:var(--font-display);font-size:1.15rem;font-weight:400}
.choice .s{font-size:.78rem;color:var(--ink-soft);line-height:1.3}
.choice[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 4px 0 var(--primary)}
.best{text-align:center;color:var(--ink-soft);font-size:.9rem}
.go{display:block;margin:6px auto 0;background:var(--sun);color:var(--sun-ink);border:0;border-radius:999px;padding:12px 56px;font-family:var(--font-display);font-weight:400;font-size:1.7rem;box-shadow:0 6px 0 var(--sun-edge);transition:transform .1s,box-shadow .1s}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sun-edge)}

/* 놀이 */
.stats{display:flex;align-items:center;gap:6px}
.score{white-space:nowrap;font-family:var(--font-display);font-size:1rem;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:2px 14px}
.stats .sp{flex:1}
.timer{font-variant-numeric:tabular-nums;min-width:4.6em;text-align:center}
.timer.low{background:var(--oops-bg);border-color:var(--oops);color:var(--oops)}
.tbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.tbar i{display:block;height:100%;width:100%;background:var(--ok);border-radius:99px;transition:width .25s linear,background .25s}
.tbar.low i{background:var(--oops)}
.giveup{background:var(--surface);border:3px solid var(--oops);border-radius:20px;padding:10px;text-align:center}
.giveup p{margin:0 0 8px}
.giveup .row button{border:0;border-radius:999px;padding:14px 26px;font-family:var(--font-display);font-size:1.4rem}
.stage{display:flex;align-items:center;gap:10px}
.stage .mascot{width:90px;height:90px}
.card{flex:1;min-width:0;background:var(--surface);border:3px solid var(--line);border-radius:24px;padding:10px 14px;text-align:center}
.card .who{font-size:.8rem;color:var(--ink-soft)}
.card .big{font-family:var(--font-display);font-weight:400;font-size:clamp(2.2rem,11vw,3.6rem);line-height:1.15;word-break:keep-all;overflow-wrap:anywhere}
.card .pic{font-size:2.2rem;line-height:1.1;min-height:1.1em}
.card .need{margin-top:2px;font-size:.95rem}
.need b{display:inline-block;font-family:var(--font-display);font-weight:400;font-size:1.5rem;color:var(--primary-ink);background:var(--primary);border-radius:12px;padding:0 10px;margin:0 2px}
.say{margin-top:8px;min-height:2.4em;background:var(--surface);border:2px dashed var(--line);border-radius:16px;padding:6px 12px;font-size:.95rem}
.say.oops{background:var(--oops-bg);border-color:var(--oops);border-style:solid}
.say.ok{background:var(--ok-bg);border-color:var(--ok);border-style:solid}
.chain{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;max-height:7.4rem;overflow:auto;padding:4px 2px}
.w{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:0 12px;font-family:var(--font-display);font-weight:400;font-size:1.05rem;border:2px solid transparent}
.w.bot{background:var(--primary-soft);border-color:var(--primary)}
.w.kid{background:var(--kid-soft);border-color:var(--kid)}
.w u{text-decoration:none;color:var(--oops);font-size:1.15em}
.chain .ar{color:var(--ink-soft);font-size:.8rem}
.entry{display:flex;gap:8px}
.entry input{flex:1;min-width:0;font:inherit;font-size:1.7rem;padding:16px 14px;border-radius:22px;border:3px solid var(--line);background:var(--surface);color:var(--ink);text-align:center}
.entry input:focus{border-color:var(--primary);outline:none}
.ok-btn{border:0;background:var(--primary);color:var(--primary-ink);border-radius:22px;padding:0 26px;min-width:4.6rem;font-family:var(--font-display);font-size:1.6rem;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.ok-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tool{border:3px solid var(--line);background:var(--surface);border-radius:22px;padding:18px 4px;min-height:5rem;font-family:var(--font-display);font-size:1.3rem;line-height:1.25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tool .ic{font-size:1.9rem;line-height:1}
.tool.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.tool:disabled{opacity:.45}
.pad{background:var(--surface);border:3px dashed var(--line);border-radius:18px;padding:8px}
.padbox{position:relative;height:150px;border-radius:12px;background:
  linear-gradient(var(--line) 1px,transparent 1px) 0 50%/100% 100% no-repeat,var(--bg)}
.padbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.padbox .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-soft);pointer-events:none;font-size:1rem}
.cands{display:flex;gap:6px;margin-top:6px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;min-height:36px}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;font-family:var(--font-display);font-size:1.2rem}
.hints{display:flex;flex-wrap:wrap;gap:8px}
.hint{border:3px solid var(--kid);background:var(--kid-soft);border-radius:20px;padding:12px 18px;min-height:3.4rem;font-family:var(--font-display);font-size:1.5rem}
.tool.pulse{animation:pulse .8s ease 7;border-color:var(--sun-edge)}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 0 7px var(--sun)}}
.hint.pen{border-color:var(--sun-edge);background:var(--sun);color:var(--sun-ink)}
.quit{align-self:center;border:2px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:999px;font-size:1.1rem;padding:12px 28px;min-height:3.2rem}

/* 결과 */
.result{text-align:center}
.result .num{font-family:var(--font-display);font-size:3.4rem;line-height:1.1;color:var(--primary)}
.stars{font-size:1.6rem;letter-spacing:2px;margin:4px 0}
.result .chain{justify-content:center;max-height:11rem;margin:8px 0}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.confetti{position:fixed;top:-2rem;font-size:1.6rem;pointer-events:none;animation:fall 2.6s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.mascot{animation:none!important}}
@media (max-width:420px){html{font-size:20px}.mascot{width:84px;height:84px}.stage .mascot{width:70px;height:70px}.hero .bubble{font-size:.92rem}}
@media (max-height:640px){.padbox{height:110px}}
</style>
</head>
<body>
<template id="mascotTpl">
<svg class="mascot" data-mood="happy" viewBox="0 0 120 120" aria-hidden="true">
  <ellipse cx="60" cy="112" rx="34" ry="5" fill="#000" opacity=".12"/>
  <path d="M60 10c-6 0-9 6-8 11 4 2 12 2 16 0 1-5-2-11-8-11z" fill="#8BCB5A" stroke="#4E8F2A" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="60" cy="64" r="48" fill="#FFC83D" stroke="#D99A00" stroke-width="4"/>
  <ellipse cx="38" cy="78" rx="9" ry="6" fill="#FF8FA3" opacity=".7"/><ellipse cx="82" cy="78" rx="9" ry="6" fill="#FF8FA3" opacity=".7"/>
  <g class="e-open" fill="#33260A"><circle cx="45" cy="60" r="6.5"/><circle cx="75" cy="60" r="6.5"/><circle cx="47" cy="58" r="2.2" fill="#fff"/><circle cx="77" cy="58" r="2.2" fill="#fff"/></g>
  <g class="e-happy" fill="none" stroke="#33260A" stroke-width="5" stroke-linecap="round"><path d="M38 62q7-10 14 0"/><path d="M68 62q7-10 14 0"/></g>
  <path class="m-smile" d="M48 80q12 12 24 0" fill="none" stroke="#33260A" stroke-width="5" stroke-linecap="round"/>
  <path class="m-oops" d="M50 88q10-9 20 0" fill="none" stroke="#33260A" stroke-width="5" stroke-linecap="round"/>
  <ellipse class="m-talk" cx="60" cy="84" rx="9" ry="8" fill="#7A2E1D"/>
</svg>
</template>

<div class="app">
  <header class="top">
    <h1 class="brand">🔗 끝말잇기 놀이터</h1>
    <div style="display:flex;gap:6px">
      <button class="iconbtn" id="btnSound" aria-label="소리 켜기/끄기">🔊</button>
      <button class="iconbtn" id="btnHome" aria-label="처음으로" hidden>🏠</button>
    </div>
  </header>

  <!-- 홈 -->
  <section id="home">
    <div class="hero"><span class="mascot-slot"></span><div class="bubble">안녕! 나는 <b>말랑이</b>야.<br>우리 같이 끝말잇기 하자! 앞 말의 <b>끝 글자</b>로 시작하는 말을 해 보는 거야.</div></div>
    <div class="group" style="margin-top:14px"><h2>누가 먼저 할까요?</h2>
      <div class="choices" id="firstChoices">
        <button class="choice" data-v="bot" aria-pressed="true"><span class="g">🤖</span><span class="t">말랑이 먼저</span><span class="s">내가 먼저 말할게</span></button>
        <button class="choice" data-v="kid" aria-pressed="false"><span class="g">🙋</span><span class="t">내가 먼저</span><span class="s">아무 말이나 괜찮아</span></button>
      </div></div>
    <div class="group"><h2>단계를 골라요</h2>
      <div class="choices" id="levelChoices">
        <button class="choice" data-v="easy" aria-pressed="true"><span class="g">🌱</span><span class="t">쉬워요</span><span class="s">쉬운 말로 이어 줘요 · 힌트 마음껏</span></button>
        <button class="choice" data-v="hard" aria-pressed="false"><span class="g">🔥</span><span class="t">도전!</span><span class="s">이어 가기 어려운 말도 내요 · 힌트 3번</span></button>
      </div></div>
    <p class="best" id="best"></p>
    <button class="go" id="btnGo">시작!</button>
  </section>

  <!-- 놀이 -->
  <section id="play" hidden>
    <div class="stats"><span class="score" id="score">이은 말 0</span><span class="score" id="stars">⭐ 0</span><span class="score timer" id="timer">⏱ 20</span><span class="sp"></span><button class="iconbtn" id="btnQuitTop" aria-label="정지">⏹ 정지</button></div>
    <div class="tbar" id="tbar" aria-hidden="true"><i id="tfill"></i></div>
    <div class="stage" style="margin-top:10px"><span class="mascot-slot" id="stageMascot"></span>
      <div class="card"><div class="who" id="who"></div><div class="big" id="big">…</div><div class="pic" id="pic"></div><div class="need" id="need"></div></div>
    </div>
    <div class="giveup" id="giveup" hidden style="margin-top:10px">
      <p>처음부터 다시해볼까? 아니면 그만할까?<br>그만하고 싶으면 정지 버튼을 눌러줘.</p>
      <div class="row"><button id="btnRestart" style="background:var(--sun);color:var(--sun-ink)">🔄 처음부터</button><button id="btnStop" style="background:var(--oops);color:#fff">⏹ 정지</button></div>
    </div>
    <div class="say" id="say" role="status" aria-live="polite"></div>
    <div class="chain" id="chain" aria-label="지금까지 이은 말"></div>
    <form class="entry" id="entry" autocomplete="off">
      <input id="inp" type="text" inputmode="text" lang="ko" enterkeyhint="send" placeholder="말을 써요" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="낱말 입력">
      <button class="ok-btn" type="submit">확인</button>
    </form>
    <div class="tools" style="margin-top:8px">
      <button class="tool" id="bMic"><span class="ic">🎙️</span>말하기</button>
      <button class="tool" id="bPen"><span class="ic">✍️</span>쓰기</button>
      <button class="tool" id="bHint"><span class="ic">💡</span>힌트</button>
    </div>
    <div class="pad" id="pad" hidden style="margin-top:8px">
      <div class="padbox" id="padbox"><canvas id="cv"></canvas><div class="ph" id="ph">여기에 손가락으로 써 보세요</div></div>
      <div class="cands" id="cands"></div>
      <div class="row" style="margin-top:4px"><button class="chip" id="bClear">🧽 지우기</button></div>
    </div>
    <div class="hints" id="hints" hidden style="margin-top:8px"></div>
    <div class="hints" id="heard" hidden style="margin-top:8px"></div>
    <button class="quit" id="btnQuit">그만하기</button>
  </section>

  <!-- 결과 -->
  <section id="result" class="result" hidden>
    <div class="hero" style="justify-content:center"><span class="mascot-slot" id="resMascot"></span></div>
    <h2 id="resTitle"></h2>
    <div class="num" id="resNum"></div>
    <div class="stars" id="resStars"></div>
    <p id="resMsg" style="margin:4px 0"></p>
    <div class="chain" id="resChain"></div>
    <div class="row" style="margin-top:10px">
      <button class="go" id="btnAgain" style="margin:0;font-size:1.4rem;padding:10px 32px">다시 하기</button>
      <button class="go" id="btnHome2" style="margin:0;font-size:1.4rem;padding:10px 32px;background:var(--surface);box-shadow:0 6px 0 var(--line);color:var(--ink)">처음으로</button>
    </div>
  </section>
</div>

<script id="kidWords" type="text/plain">
# 저학년 끝말잇기 낱말 (낱말 뒤에 붙은 이모지는 그림으로 보여 줘요). 한 줄에 여러 개, 공백으로 구분.
# 동물

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const store = { get(k, d){ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} } };
const rnd = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = (s) => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ───────── 글자 규칙: 두음법칙을 넓게 받아 주기 ─────────
   끝 글자가 '리'면 '리'도 '이'도, '녀'면 '녀·여·려'도 OK. 어린이가 어느 쪽으로 말해도 맞게 이어 줘요. */
const BASE = 0xAC00;
const dec = (c) => { const n = c.charCodeAt(0) - BASE; return (n < 0 || n > 11171) ? null : { i: Math.floor(n / 588), m: Math.floor(n % 588 / 28), f: n % 28 }; };
const enc = (i, m, f) => String.fromCharCode(BASE + i * 588 + m * 28 + f);
const MID_I = new Set([2, 3, 6, 7, 12, 17, 20]);   // ㅑ ㅒ ㅕ ㅖ ㅛ ㅠ ㅣ
const MID_A = new Set([0, 1, 8, 11, 13, 18]);      // ㅏ ㅐ ㅗ ㅚ ㅜ ㅡ
function startsFor(syl){
  const out = new Set([syl]), d = dec(syl);
  if (!d) return [...out];
  const { i, m, f } = d;
  if (i === 5){ if (MID_I.has(m)){ out.add(enc(11, m, f)); out.add(enc(2, m, f)); } else if (MID_A.has(m)){ out.add(enc(2, m, f)); } }       // ㄹ → ㅇ / ㄴ
  else if (i === 2){ if (MID_I.has(m)){ out.add(enc(11, m, f)); out.add(enc(5, m, f)); } else if (MID_A.has(m)){ out.add(enc(5, m, f)); } }    // ㄴ → ㅇ / ㄹ
  else if (i === 11 && MID_I.has(m)){ out.add(enc(5, m, f)); out.add(enc(2, m, f)); }                                                    // ㅇ → ㄹ / ㄴ
  return [...out];
}
const sylls = (w) => [...w];
const first = (w) => sylls(w)[0];
const last = (w) => { const s = sylls(w); return s[s.length - 1]; };
const startsOk = (w, req) => !req || req.includes(first(w));

/* ───────── 낱말 사전 ───────── */
const KID = new Map();           // 낱말 → 이모지('' 가능)  : 아이가 알 만한 쉬운 말
const EXTRA = new Set();         // 보조 사전(한자어 중 흔한 말)
const byFirst = new Map();       // 첫 글자 → [낱말…] (KID 우선 / EXTRA)
const xByFirst = new Map();
const cByFirst = new Map();      // 보조 사전 중 아주 흔한 말
function addWord(w, emoji, extra){
  const m = extra === 'c' ? cByFirst : extra ? xByFirst : byFirst;
  const k = first(w);
  if (!m.has(k)) m.set(k, []);
  m.get(k).push(w);
}
(function loadKid(){
  const txt = document.getElementById('kidWords').textContent;
  for (const line of txt.split('\n')){
    if (!line.trim() || line.trim().startsWith('#') || line.trim().startsWith('/*')) continue;
    for (const tok of line.trim().split(/\s+/)){
      const m = tok.match(/^([가-힣]+)(.*)$/);
      if (!m || sylls(m[1]).length < 2 || KID.has(m[1])) continue;
      KID.set(m[1], m[2] || '');
      addWord(m[1], m[2], false);
    }
  }
})();
let extraLoaded = false;
fetch('extra.txt').then(r => r.ok ? r.text() : '').then(t => {
  for (const w of t.split('\n')){
    let x = w.trim(); const c = x[0] === '+'; if (c) x = x.slice(1);
    if (x && !KID.has(x) && !EXTRA.has(x)){ EXTRA.add(x); addWord(x, '', c ? 'c' : true); }
  }
  extraLoaded = EXTRA.size > 0;
}).catch(() => {});
const known = (w) => KID.has(w) || EXTRA.has(w);

/* 이 글자(들)로 시작하는 말이 몇 개나 있나 = 이어 가기 쉬운 정도 */
const cntCache = new Map();
function ease(syl){
  if (cntCache.has(syl)) return cntCache.get(syl);
  let n = 0;
  for (const s of startsFor(syl)) n += (byFirst.get(s)?.length || 0) * 3 + (cByFirst.get(s)?.length || 0) + (xByFirst.get(s)?.length || 0);
  cntCache.set(syl, n);
  return n;
}
const emojiOf = (w) => KID.get(w) || '';

/* ───────── 소리 ───────── */
let soundOn = store.get('wc-sound', '1') === '1';
const mascots = [];
let actx = null;
function beep(freqs){
  if (!soundOn) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    for (const f of freqs){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .16);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + .17); t += .1;
    }
  }catch(e){}
}
let speakId = 0;
function speak(text, done){
  const id = ++speakId; let fin = false;
  const end = () => { if (fin) return; fin = true; if (id === speakId){ setSpeaking(false); done && done(); } };
  try{ speechSynthesis.cancel(); }catch(e){}
  if (!soundOn || !('speechSynthesis' in window)){ setTimeout(end, 300); return; }
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = .9;
    const v = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v;
    u.onstart = () => setSpeaking(true); u.onend = end; u.onerror = end;
    speechSynthesis.speak(u);
    setTimeout(end, Math.min(6000, 1500 + text.length * 250));   // 소리가 안 끝나도 게임이 멈추지 않게
  }catch(e){ setTimeout(end, 300); }
}
function setSpeaking(on){ mascots.forEach(m => m.classList.toggle('speaking', on)); }
function mood(m){ mascots.forEach(x => x.dataset.mood = m); }
function setSoundUI(){ $('#btnSound').textContent = soundOn ? '🔊' : '🔇'; }
$('#btnSound').onclick = () => { soundOn = !soundOn; store.set('wc-sound', soundOn ? '1' : '0'); if (!soundOn){ try{ speechSynthesis.cancel(); }catch(e){} setSpeaking(false); } setSoundUI(); };
setSoundUI();
document.querySelectorAll('.mascot-slot').forEach(s => { const n = document.getElementById('mascotTpl').content.firstElementChild.cloneNode(true); s.replaceWith(n); n.id = s.id || ''; mascots.push(n); });

/* ───────── 화면 ───────── */
const views = { home: $('#home'), play: $('#play'), result: $('#result') };
function show(v){
  for (const k in views) views[k].hidden = k !== v;
  $('#btnHome').hidden = v === 'home';
  if (v !== 'play') { stopTimer(); stopMic(); try{ speechSynthesis.cancel(); }catch(e){} setSpeaking(false); }
  window.scrollTo(0, 0);
}
let opts = { first: store.get('wc-first', 'bot'), level: store.get('wc-level', 'easy') };
function bindChoices(id, key){
  const box = document.getElementById(id);
  const sync = () => box.querySelectorAll('.choice').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === opts[key])));
  box.querySelectorAll('.choice').forEach(b => b.onclick = () => { opts[key] = b.dataset.v; store.set('wc-' + key, opts[key]); sync(); });
  sync();
}
bindChoices('firstChoices', 'first'); bindChoices('levelChoices', 'level');
function showBest(){ const b = +store.get('wc-best', '0'); $('#best').textContent = b ? `🏆 내 기록: ${b}개 이어 말하기` : ''; }
showBest();

/* ───────── 게임 ───────── */
const G = { chain: [], used: new Set(), req: null, stars: 0, kidCount: 0, hintsLeft: Infinity, busy: false, over: false, hinted: false };
const line = (kind, msg) => { const s = $('#say'); s.className = 'say ' + (kind || ''); s.textContent = msg || ''; };
function wordHTML(w, hiF, hiL){
  const s = sylls(w);
  return s.map((c, i) => ((i === 0 && hiF) || (i === s.length - 1 && hiL)) ? `<u>${esc(c)}</u>` : esc(c)).join('');
}
function renderChain(el, withHi){
  const parts = [];
  G.chain.forEach((c, i) => {
    if (i) parts.push('<span class="ar">▶</span>');
    parts.push(`<span class="w ${c.who}">${wordHTML(c.word, withHi && i > 0, withHi && i < G.chain.length - 1)}${esc(c.emoji || '')}</span>`);
  });
  el.innerHTML = parts.join('');
  el.scrollTop = el.scrollHeight;
}
function showNeed(){
  const n = $('#need');
  if (!G.req){ n.innerHTML = '아무 말이나 먼저 말해 봐요!'; return; }
  const [a, ...rest] = G.req;
  n.innerHTML = `<b>${esc(a)}</b>${rest.length ? '<small>(' + rest.map(esc).join(' · ') + ' 도 돼요)</small>' : ''} (으)로 시작하는 말!`;
}
function updateStats(){
  $('#score').textContent = `이은 말 ${G.kidCount}`;
  $('#stars').textContent = `⭐ ${G.stars}`;
  $('#bHint').innerHTML = '<span class="ic">💡</span>' + (G.hintsLeft === Infinity ? '힌트' : `힌트 ${G.hintsLeft}`);
  $('#bHint').disabled = G.hintsLeft <= 0;
}
function setBusy(b){ G.busy = b; $('#inp').disabled = b; $('#entry button').disabled = b; $('#bMic').disabled = b; $('#bPen').disabled = b; $('#bHint').disabled = b || G.hintsLeft <= 0; }

function startGame(){
  Object.assign(G, { chain: [], used: new Set(), req: null, stars: 0, kidCount: 0, hintsLeft: opts.level === 'hard' ? 3 : Infinity, busy: false, over: false });
  show('play'); closePanels(); stopTimer(); $('#giveup').hidden = true; paintTimer(LIMIT); updateStats();
  $('#inp').value = ''; $('#chain').innerHTML = ''; $('#pic').textContent = ''; mood('happy');
  if (opts.first === 'bot'){
    $('#who').textContent = ''; $('#big').textContent = '…';
    line('', '내가 먼저 할게!');
    setBusy(true);
    setTimeout(() => botTurn(null, '내가 먼저 할게!'), 500);
  } else {
    $('#who').textContent = '내 차례'; $('#big').textContent = '?'; showNeed();
    line('', '먼저 아무 말이나 해 봐! 두 글자 이상이면 좋아요.');
    speak('먼저 아무 말이나 해 봐!', () => { if (!G.over) turnStart(); }); setBusy(false);
  }
}

/* ───────── 대답 시간: 20초 카운트다운, 못 하면 한 번 더 기회 ───────── */
const LIMIT = 20;
let tmr = null, tEnd = 0, strikes = 0;
function stopTimer(){ clearInterval(tmr); tmr = null; }
function paintTimer(left){
  const s = Math.max(0, Math.ceil(left));
  $('#timer').textContent = `⏱ ${s}`;
  const low = left <= 5;
  $('#timer').classList.toggle('low', low); $('#tbar').classList.toggle('low', low);
  $('#tfill').style.width = Math.max(0, left / LIMIT * 100) + '%';
}
function startTimer(){
  stopTimer(); if (G.over) return;
  tEnd = Date.now() + LIMIT * 1000; paintTimer(LIMIT);
  tmr = setInterval(() => {
    const left = (tEnd - Date.now()) / 1000;
    if (left <= 0){ stopTimer(); paintTimer(0); timeUp(); } else paintTimer(left);
  }, 250);
}
function timeUp(){
  if (G.over || G.busy) return;
  stopMic(); closePanels();
  strikes++;
  mood('oops'); beep([260, 200]);
  if (strikes === 1){
    line('oops', '다시 생각해 보자.');
    speak('다시 생각해 보자.', () => { if (!G.over) startTimer(); });
  } else {
    line('oops', '처음부터 다시해볼까? 아니면 그만할까? 그만하고 싶으면 정지 버튼을 눌러줘.');
    $('#giveup').hidden = false; $('#inp').disabled = true; $('#entry button').disabled = true; $('#bMic').disabled = true; $('#bPen').disabled = true; $('#bHint').disabled = true;
    speak('처음부터 다시해볼까? 아니면 그만할까? 그만하고 싶으면 정지 버튼을 눌러줘.');
  }
}
function turnStart(){ strikes = 0; $('#giveup').hidden = true; startTimer(); }

/* 아이가 낸 말 처리 */
function normalize(raw){
  const t = (raw || '').normalize('NFC').trim().split(/\s+/)[0] || '';
  return t.replace(/[^가-힣]/g, '');
}
function submit(raw, fromHint){
  if (G.busy || G.over) return;
  const word = normalize(raw);
  if (!word){ mood('oops'); line('oops', '한글로 말을 써 주세요.'); return; }
  if (sylls(word).length < 2){ mood('oops'); line('oops', '두 글자 이상으로 말해 줘요!'); return; }
  if (!startsOk(word, G.req)){
    mood('oops'); beep([260, 200]);
    const n = G.req.length > 1 ? `‘${G.req[0]}’ 또는 ‘${G.req.slice(1).join('’, ‘')}’` : `‘${G.req[0]}’`;
    line('oops', `‘${word}’은(는) ${n}(으)로 시작하지 않아요. 다시 해 볼까요?`);
    speak(`${G.req[0]}로 시작하는 말을 해 봐요`);
    $('#inp').select(); return;
  }
  if (G.used.has(word)){ mood('oops'); beep([260, 200]); line('oops', `‘${word}’은(는) 벌써 나온 말이에요. 다른 말을 해 볼까요?`); return; }

  // 통과!
  stopTimer(); strikes = 0; voiceFails = 0; paintTimer(LIMIT);
  const isKnown = known(word);
  G.used.add(word);
  G.chain.push({ who: 'kid', word, emoji: emojiOf(word) });
  G.kidCount++;
  if (!fromHint) G.stars++;
  $('#inp').value = ''; clearPad(); closePanels();
  $('#who').textContent = '내가 한 말'; $('#big').textContent = word; $('#pic').textContent = emojiOf(word);
  renderChain($('#chain'), true); updateStats();
  mood('cheer'); beep([523, 659, 784]);
  const praise = rnd(['좋아, 잘했어!', '맞아 맞아!', '우와, 멋져!', '정답이야!', '그렇지!']);
  const note = isKnown ? praise : `‘${word}’? 처음 들어 본 말인데, 괜찮아! 이어 갈게.`;
  line('ok', note);
  G.req = startsFor(last(word));
  setBusy(true);
  speak(word, () => setTimeout(() => botTurn(word, note), 250));
}

/* 말랑이 차례 */
function pickBot(req){
  const ok = (w) => !G.used.has(w);
  let pool = [];
  if (req){ for (const s of req) pool.push(...(byFirst.get(s) || [])); pool = pool.filter(ok); }
  else pool = [...KID.keys()].filter(w => sylls(w).length <= 3);
  let usedExtra = false;
  if (!pool.length && req){   // 쉬운 말이 없으면 흔한 한자어 → 그래도 없으면 보조 사전 전체
    for (const m of [cByFirst, xByFirst]){ for (const s of req) pool.push(...(m.get(s) || [])); pool = pool.filter(ok); if (pool.length) break; }
    usedExtra = true;
  }
  if (!pool.length) return null;
  const score = (w) => ease(last(w));
  const scored = pool.map(w => ({ w, e: score(w), n: sylls(w).length }));
  let cand;
  if (opts.level === 'hard'){
    const hardOnes = scored.filter(x => x.e > 0 && x.e <= 40);
    cand = (hardOnes.length && Math.random() < .7) ? hardOnes : scored.filter(x => x.e > 0);
  } else {
    const easy = scored.filter(x => x.e >= 120);
    cand = easy.length ? easy : scored.filter(x => x.e >= 30);
    if (!cand.length) cand = scored.filter(x => x.e > 0);
  }
  if (!cand.length) cand = scored;   // 이어 갈 말이 없는 말뿐이면 어쩔 수 없이(아이가 이겨요)
  if (!usedExtra){ const pic = cand.filter(x => emojiOf(x.w)); if (pic.length && Math.random() < .6) cand = pic; }
  const short = cand.filter(x => x.n <= 3); if (short.length) cand = short;
  return rnd(cand).w;
}
function botTurn(prev, lead){
  if (G.over) return;
  const w = pickBot(G.req);
  if (!w){ return finish(true); }
  G.used.add(w);
  G.chain.push({ who: 'bot', word: w, emoji: emojiOf(w) });
  G.req = startsFor(last(w));
  $('#who').textContent = '말랑이의 말'; $('#big').textContent = w; $('#pic').textContent = emojiOf(w);
  renderChain($('#chain'), true); showNeed();
  mood('happy');
  line('', prev ? `${lead}  나는 ‘${w}’!` : `나는 ‘${w}’! 이제 네 차례야.`);
  speak(w, () => {
    if (G.over) return;
    setBusy(false); $('#inp').focus({ preventScroll: true }); turnStart();
  });
}

/* 끝내기 */
function finish(kidWins){
  if (G.over) return;
  G.over = true; stopTimer(); stopMic(); setBusy(true); $('#giveup').hidden = true;
  const n = G.kidCount, prevBest = +store.get('wc-best', '0');
  const newBest = n > prevBest;
  if (newBest) store.set('wc-best', String(n));
  showBest();
  if (kidWins){
    mood('cheer'); beep([523, 659, 784, 1047]);
    line('ok', '으앗, 이어 갈 말이 생각 안 나! 내가 졌어. 너 정말 대단해!');
    speak('내가 졌어! 너 정말 대단해!', () => setTimeout(showResult, 400, kidWins, newBest));
  } else setTimeout(showResult, 100, kidWins, newBest);
}
function showResult(kidWins, newBest){
  show('result');
  $('#resTitle').textContent = kidWins ? '🎉 말랑이가 졌어요!' : '수고했어요!';
  $('#resNum').textContent = `${G.kidCount}개`;
  $('#resStars').textContent = G.stars ? '⭐'.repeat(Math.min(G.stars, 10)) + (G.stars > 10 ? ` ×${G.stars}` : '') : '';
  const n = G.kidCount;
  $('#resMsg').textContent = (newBest && n > 0 ? '🏆 새 기록이에요! ' : '') + (n === 0 ? '다음엔 같이 이어 봐요!' : n < 5 ? '잘했어요! 한 번 더 해 볼까요?' : n < 10 ? '와, 아주 잘 이었어요!' : '끝말잇기 박사님이에요!');
  renderChain($('#resChain'), true);
  mood(n >= 5 || kidWins ? 'cheer' : 'happy');
  if (n >= 5 || kidWins) confetti();
  speak(n === 0 ? '다음엔 같이 이어 봐요' : `${n}개나 이었어요. 잘했어요!`);
}
function confetti(){
  const e = ['🎉', '⭐', '🎈', '✨', '🍀', '💛'];
  for (let i = 0; i < 24; i++){
    const s = document.createElement('span'); s.className = 'confetti'; s.textContent = rnd(e);
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * 1.2 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 4200);
  }
}

/* ───────── 입력: 키보드 / 말하기 / 손글씨 / 힌트 ───────── */
$('#entry').onsubmit = (e) => { e.preventDefault(); submit($('#inp').value); };

// ───── 소리·글씨가 조금 틀려도 비슷한 낱말 찾아 주기 (자모 단위 거리) ─────
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
const SIMILAR = ['ㄱㅋㄲ', 'ㄷㅌㄸ', 'ㅂㅍㅃ', 'ㅈㅊㅉ', 'ㅅㅆ', 'ㅐㅔ', 'ㅒㅖ', 'ㅅㅈㅊㅌㄷㅎ', 'ㅂㅍ', 'ㅗㅓ'];   // 헷갈리기 쉬운 소리는 덜 다른 것으로
function jamo(w){ const o = []; for (const c of w){ const d = dec(c); if (!d){ o.push(c); continue; } o.push(CHO[d.i], JUNG[d.m]); if (d.f) o.push(JONG[d.f]); } return o; }
const subCost = (a, b) => a === b ? 0 : SIMILAR.some(g => g.includes(a) && g.includes(b)) ? .4 : 1;
function jdist(a, b){
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++){
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + subCost(a[i - 1], b[j - 1]));
    prev = cur;
  }
  return prev[b.length];
}
/* heard(들린 말 후보들)와 소리가 가장 가까운, 이어야 할 글자로 시작하는 낱말 찾기 */
function fuzzy(heard, req){
  if (!req || !heard.length) return [];
  const hj = heard.map(jamo), seen = new Set(), res = [];
  for (const s of req) for (const m of [byFirst, cByFirst, xByFirst]) for (const w of (m.get(s) || [])){
    if (seen.has(w) || G.used.has(w)) continue; seen.add(w);
    const wj = jamo(w); let best = 9;
    for (const x of hj){ if (Math.abs(x.length - wj.length) <= 3) best = Math.min(best, jdist(x, wj)); }
    if (best <= 2.2 && best / wj.length <= .34) res.push({ w, d: best - (KID.has(w) ? .4 : 0) });
  }
  return res.sort((x, y) => x.d - y.d).slice(0, 4);
}
const FILLER = /^(음+|어+|아+|그+|저+|이+|응)$/;
function wordsFrom(transcripts){      // "사과요", "음 사과" 같은 말에서 낱말만 뽑기
  const out = [];
  for (const t of transcripts) for (const tok of (t || '').trim().split(/\s+/)){
    const c = normalize(tok); if (!c || FILLER.test(c)) continue;
    const st = c.replace(/(이에요|예요|이야|이다|이요|요|야)$/, '');
    for (const v of (known(st) && st !== c ? [st, c] : [c, st])) if (sylls(v).length >= 2 && !out.includes(v)) out.push(v);
  }
  return out;
}

// ───── 말하기 (브라우저 음성 인식) ─────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, voiceFails = 0;
function stopMic(){ if (rec){ try{ rec.abort(); }catch(e){} rec = null; } $('#bMic').classList.remove('on'); $('#bMic').innerHTML = '<span class="ic">🎙️</span>말하기'; }
function hideHeard(){ $('#heard').hidden = true; }
function nudgePen(){ $('#bPen').classList.add('pulse'); setTimeout(() => $('#bPen').classList.remove('pulse'), 6000); }
function suggestPen(){            // 말하기가 잘 안 되면 손글씨로 안내
  if (G.busy || G.over) return;
  voiceFails = 0; hideHeard();
  if ($('#pad').hidden) $('#bPen').click();
  mood('oops'); line('oops', '잘 안 들려서 미안해. 이번에는 손으로 써 볼까?'); nudgePen();
  speak('잘 안 들려. 손으로 써 볼까?');
}
function showHeard(words, heardText){     // "혹시 이 말?" 고르기
  $('#heard').innerHTML = words.map(w => `<button class="hint" type="button" data-w="${esc(w)}">${esc(emojiOf(w))} ${esc(w)}</button>`).join('') +
    (voiceFails >= 2 ? '<button class="hint pen" type="button" data-pen="1">✍️ 손으로 쓸래</button>' : '');
  $('#heard').hidden = false;
  mood('happy'); line('', `혹시 이 말이야? 눌러 봐! (들린 소리: ${heardText || '…'})`);
  $('#heard').querySelectorAll('.hint').forEach(b => b.onclick = () => { if (b.dataset.pen){ suggestPen(); } else { hideHeard(); submit(b.dataset.w); } });
  if (voiceFails >= 2) nudgePen();
}
function micResult(alts){
  const ok = (w) => startsOk(w, G.req) && !G.used.has(w);
  const exact = alts.find(w => ok(w) && known(w));
  if (exact){ voiceFails = 0; return submit(exact); }                        // ① 정확히 알아들음
  if (!G.req){ if (alts[0]){ voiceFails = 0; return submit(alts[0]); } }       // 처음 말하는 차례는 뭐든 OK
  const cands = fuzzy(alts, G.req);
  if (cands.length && cands[0].d <= 1.2 && (cands.length === 1 || cands[1].d - cands[0].d >= 1)){
    voiceFails = 0; $('#inp').value = cands[0].w; return submit(cands[0].w);   // ② 소리가 거의 같은 낱말로 자동 보정
  }
  if (cands.length){ voiceFails++; return showHeard(cands.slice(0, 3).map(c => c.w), alts[0]); }   // ③ 후보 보여 주고 고르게
  const raw = alts.find(ok);
  if (raw){ voiceFails = 0; return submit(raw); }                            // 사전에 없어도 첫 글자가 맞으면 받아 줌
  voiceFails++; mood('oops');
  if (voiceFails >= 2) return suggestPen();                                  // ④ 두 번 못 알아들으면 손글씨 안내
  line('oops', `이렇게 들렸어요: ‘${alts[0] || '…'}’. 다시 말해 볼까요?`);
}
$('#bMic').onclick = () => {
  if (G.busy) return;
  if (!SR){ line('oops', '이 기기는 말하기를 지원하지 않아요. 손으로 써 주세요.'); if ($('#pad').hidden) $('#bPen').click(); return; }
  if (rec){ stopMic(); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  closePanels();
  rec = new SR(); rec.lang = 'ko-KR'; rec.interimResults = true; rec.maxAlternatives = 5; rec.continuous = false;
  let finals = [], interim = '', err = '', early = null;
  rec.onstart = () => { $('#bMic').classList.add('on'); $('#bMic').innerHTML = '<span class="ic">👂</span>듣는 중…'; line('', '말해 보세요…'); };
  rec.onresult = (e) => {
    let t = '';
    for (const r of e.results){ t += r[0].transcript; if (r.isFinal) finals = [...r].map(a => a.transcript); }
    interim = t; line('', '듣는 중: ' + t);
    // 중간 결과가 이미 정답이면 끝까지 기다리지 않고 바로 마무리
    if (!early && wordsFrom([t]).some(w => startsOk(w, G.req) && !G.used.has(w) && known(w))) early = setTimeout(() => { try{ rec && rec.stop(); }catch(e){} }, 600);
  };
  rec.onerror = (e) => { err = e.error; };
  rec.onend = () => {
    clearTimeout(early); rec = null; $('#bMic').classList.remove('on'); $('#bMic').innerHTML = '<span class="ic">🎙️</span>말하기';
    if (G.busy || G.over) return;
    const alts = wordsFrom(finals.length ? finals : interim ? [interim] : []);
    if (err === 'not-allowed' || err === 'service-not-allowed'){ line('oops', '마이크를 쓸 수 없어요. 손으로 써 볼까요?'); if ($('#pad').hidden) $('#bPen').click(); return; }
    if (!alts.length){
      voiceFails++; mood('oops');
      if (voiceFails >= 2) return suggestPen();
      line('oops', err === 'no-speech' || !err ? '소리가 안 들렸어요. 다시 말해 볼까요?' : '잘 못 들었어요. 다시 해 봐요.'); return;
    }
    micResult(alts);
  };
  try{ rec.start(); }catch(e){ rec = null; }
};

// 손으로 쓰기 (구글 입력도구 필기 인식)
const cv = $('#cv'), ctx = cv.getContext('2d');
let strokes = [], cur = null, t0 = 0, drawing = false, autoT = null, recogId = 0;
function fitPad(){ const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); redraw(); }
function redraw(){
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore();
  ctx.lineCap = ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = getComputedStyle(document.body).color;
  for (const s of strokes){ ctx.beginPath(); s[0].forEach((x, i) => i ? ctx.lineTo(x, s[1][i]) : ctx.moveTo(x, s[1][i])); if (s[0].length === 1) ctx.lineTo(s[0][0] + .1, s[1][0]); ctx.stroke(); }
}
new ResizeObserver(() => { if (!$('#pad').hidden) fitPad(); }).observe($('#padbox'));
const pt = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener('pointerdown', (e) => {
  cv.setPointerCapture(e.pointerId); drawing = true; clearTimeout(autoT); $('#ph').hidden = true;
  if (!t0) t0 = performance.now();
  const [x, y] = pt(e); cur = [[x], [y], [Math.round(performance.now() - t0)]]; strokes.push(cur); redraw();
});
cv.addEventListener('pointermove', (e) => { if (!drawing) return; const [x, y] = pt(e); cur[0].push(x); cur[1].push(y); cur[2].push(Math.round(performance.now() - t0)); redraw(); });
cv.addEventListener('pointercancel', () => { drawing = false; });
cv.addEventListener('pointerup', () => { drawing = false; clearTimeout(autoT); autoT = setTimeout(recognize, 1000); });   // 1초 쉬면 자동 인식
function clearPad(){ clearTimeout(autoT); recogId++; strokes = []; t0 = 0; redraw(); $('#ph').hidden = false; $('#cands').innerHTML = ''; }
$('#bClear').onclick = () => { clearPad(); $('#inp').value = ''; };
async function recognize(){
  if (!strokes.length || drawing) return;
  const id = ++recogId, r = cv.getBoundingClientRect();
  line('', '글씨를 읽는 중…');
  try{
    const res = await fetch('https://inputtools.google.com/request?itc=ko-t-i0-handwrit&app=wordchain', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ options: 'enable_pre_space', requests: [{ writing_guide: { writing_area_width: Math.round(r.width), writing_area_height: Math.round(r.height) }, ink: strokes, language: 'ko', max_num_results: 8 }] }) });
    const raw = await res.json();
    if (id !== recogId) return;
    if (raw[0] !== 'SUCCESS') throw new Error('x');
    const c = (raw[1]?.[0]?.[1] || []).map(normalize).filter(Boolean);
    if (!c.length){ line('oops', '글씨를 알아보지 못했어요. 다시 써 볼까요?'); return; }
    const exact = c.find(w => startsOk(w, G.req) && !G.used.has(w) && known(w));
    const fz = exact ? [] : fuzzy(c, G.req);
    const best = exact || (fz[0] && fz[0].d <= 1.2 ? fz[0].w : '') || c.find(w => startsOk(w, G.req)) || c[0];
    const shown = [...new Set([best, ...c, ...fz.slice(0, 2).map(x => x.w)])];
    $('#inp').value = best;
    $('#cands').innerHTML = shown.map(w => `<button class="chip" type="button">${esc(w)}</button>`).join('');
    $('#cands').querySelectorAll('.chip').forEach(b => b.onclick = () => { $('#inp').value = b.textContent; });
    line('', `이렇게 읽었어요: ‘${best}’. 맞으면 [확인]을 눌러요!`);
  }catch(e){ if (id === recogId) line('oops', '글씨 읽기가 안 돼요. 키보드나 말하기를 써 주세요.'); }
}
function closePanels(){ $('#pad').hidden = true; $('#hints').hidden = true; $('#heard').hidden = true; $('#bPen').classList.remove('on'); }
$('#bPen').onclick = () => {
  if (G.busy) return;
  const open = $('#pad').hidden; closePanels(); $('#pad').hidden = !open; $('#bPen').classList.toggle('on', open);
  if (open){ stopMic(); fitPad(); line('', '아래 칸에 손가락으로 말을 써 보세요.'); }
};

// 힌트
$('#bHint').onclick = () => {
  if (G.busy || G.hintsLeft <= 0) return;
  const open = $('#hints').hidden; closePanels();
  if (!open) return;
  let pool = [];
  for (const s of (G.req || [])) pool.push(...(byFirst.get(s) || []));
  if (!G.req) pool = [...KID.keys()];
  pool = shuffle(pool.filter(w => !G.used.has(w) && sylls(w).length <= 4));
  const withPic = pool.filter(emojiOf), pickFrom = withPic.length >= 3 ? withPic : pool;
  const good = pickFrom.filter(w => ease(last(w)) >= 60);
  const hs = (good.length >= 3 ? good : pickFrom).slice(0, 3);
  if (!hs.length){ line('oops', '힌트가 떠오르지 않아요. 네가 좋아하는 말을 해 봐!'); return; }
  $('#hints').innerHTML = hs.map(w => `<button class="hint" type="button">${esc(emojiOf(w))} ${esc(w)}</button>`).join('');
  $('#hints').hidden = false; $('#bHint').classList.add('on');
  line('', '이 중에서 골라도 되고, 내가 아는 다른 말을 해도 돼요!');
  $('#hints').querySelectorAll('.hint').forEach((b, i) => b.onclick = () => {
    if (G.hintsLeft !== Infinity) G.hintsLeft--;
    submit(hs[i], true);
  });
};

/* ───────── 버튼 연결 ───────── */
$('#btnGo').onclick = startGame;
$('#btnAgain').onclick = startGame;
$('#btnHome').onclick = () => { G.over = true; show('home'); };
$('#btnRestart').onclick = startGame;
$('#btnStop').onclick = () => finish(false);
$('#btnHome2').onclick = () => show('home');
const quit = () => { if (G.over) return; finish(false); };
$('#btnQuit').onclick = quit; $('#btnQuitTop').onclick = quit;
try{ speechSynthesis.getVoices(); }catch(e){}
window.__wc = { G, startsFor, pickBot, known, KID, EXTRA, get fuzzy(){ return fuzzy; } };   // 테스트용
</script>
